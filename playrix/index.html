<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Match3</title>
    <style>
        html, body {
            margin: 0;
            height: 100%;
            overflow: hidden;
        }
        body {
            display: flex;
            justify-content: center;
            align-items: center;

            /* Фон всей страницы. Картинка лежит рядом в assets/ и отдаётся
               сервером как обычный файл (в index.data — её отдельная копия
               для C++). Цвет виден, только пока картинка не загрузилась. */
            background-color: #1e1e28;
            background-image: url('assets/bg.png');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        canvas {
            /* Канвас прозрачен (см. cfg::kBgAlpha), поэтому за игровым полем
               виден фон страницы. Рамки нет — она обвела бы пустоту вокруг поля. */
            background: transparent;
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas" oncontextmenu="event.preventDefault()"></canvas>

    <script>
        var Module = {
            canvas: document.getElementById('canvas')
        };
    </script>
    <script async type="text/javascript" src="index.js"></script>
</body>
</html>
