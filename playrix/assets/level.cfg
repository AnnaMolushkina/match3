# Параметры уровня Match-3.
# Формат: ключ = значение, всё после # — комментарий.
# Файл читается на старте, пересборка для правок не нужна.

# --- размер поля ---
rows = 8
cols = 8
tile = 60

# --- цвета фишек уровня ---
# Число цветов. Должно совпадать с количеством строк `chip` ниже. Минимум 3.
colors = 5

# Какие именно цвета — номера спрайтов из палитры kChipSprites (src/Config.h):
#   0 — красный, 1 — зелёный, 2 — голубой, 3 — жёлтый, 4 — фиолетовый.
# Сами картинки общие для всех уровней и грузятся один раз при запуске,
# уровень лишь выбирает нужные. Повторы запрещены.
chip = 0
chip = 1
chip = 2
chip = 3
chip = 4

# --- цель уровня ---
# Собрать goal_amount фишек цвета goal_color (номер спрайта из списка выше).
goal_color = 0
goal_amount = 40
