# Параметры уровня Match-3.
# Формат: ключ = значение, всё после # — комментарий.
# Файл читается на старте, пересборка для правок не нужна.

# --- размер поля ---
rows = 8
cols = 8
tile = 60

# --- число цветов фишек ---
# Должно совпадать с количеством строк `chip` ниже. Минимум 3.
colors = 5

# Спрайты фишек: порядок задаёт индекс цвета (0, 1, 2, ...).
chip = assets/red_60.png
chip = assets/green_60.png
chip = assets/cyan_60.png
chip = assets/yellow_60.png
chip = assets/purple_60.png

# --- цель уровня ---
# Собрать goal_amount фишек цвета goal_color (индекс из списка chip выше).
goal_color = 0
goal_amount = 20

# --- прочие ассеты ---
font = assets/font.ttf
#background = assets/bg.png
